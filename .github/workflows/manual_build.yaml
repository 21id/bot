name: (MANUAL) Building Docker image for Development purposes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Choose tag to build for'
        required: true
        default: latest-rc

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/21id/bot:${{ github.event.inputs.tag }}
