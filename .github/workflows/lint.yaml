name: Lint

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app

      - name: Check formatting with black
        run: black --check app

      - name: Run mypy
        # Codebase is not yet strict-clean; keep reporting but do not block merges.
        # Remove continue-on-error once mypy passes.
        continue-on-error: true
        run: mypy app
